# Telosgard on Cloudflare (ADR 0003): one Worker serves the app's static files and the /api routes.
name = "telosgard"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "../dist"
binding = "ASSETS"
# The Worker only runs for /api/*; everything else is a static file.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "telosgard"
database_id = "c88fb1f7-b79a-4043-b680-ee7f6d6e2f50"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "telosgard-files"

[vars]
# Claude calls per 24 hours: the owner (OWNER_EMAILS, a secret) and everyone else (testers).
CLAUDE_DAILY_LIMIT = "300"
TESTER_DAILY_LIMIT = "50"
