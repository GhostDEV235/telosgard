# Auto-deploy (ADR 0006). Every pull request gets a preview link; every merge to main goes live.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with "Edit Cloudflare Workers" and "D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the telosgard Worker
#
# Previews are separate Worker versions, but they use the live D1 database and R2 bucket, and they
# never apply migrations. Review a pull request before opening its preview with a real account.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  RUST_VERSION: "1.99.1"
  TRUNK_VERSION: "0.22.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.17.0"

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix cloudflare

      - name: Test
        run: |
          cargo test -p telosgard-core -p telosgard-content
          npm test --prefix cloudflare
          npm run typecheck --prefix cloudflare

      - name: Build the app and the dashboard
        run: scripts/build.sh

      - name: Preview (pull requests)
        # Pull requests from forks get no secrets, so they build and test but don't upload a preview.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$url" ] && gh pr comment "${{ github.event.number }}" --repo "${{ github.repository }}" --edit-last --create-if-none --body "Preview: $url (uses the live database; no migrations applied)"

      - name: Migrate and deploy (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply telosgard --remote
          npx wrangler deploy
