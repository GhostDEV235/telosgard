<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gold School Spike</title>
  <link data-trunk rel="rust" data-wasm-opt="z" />
  <style>
    :root { color-scheme:dark; --bg:#0F1F17; --surface:#1E3A2E; --text:#C7CBB8; --muted:#9DAD98; --fill:#3E5A3F; --on-fill:#F4F5EF; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { color-scheme:light; --bg:#E4E6DA; --surface:#F4F5EF; --text:#0F1F17; --muted:#4E5F4B; } }
    :root[data-theme="light"] { color-scheme:light; --bg:#E4E6DA; --surface:#F4F5EF; --text:#0F1F17; --muted:#4E5F4B; }
    :root[data-theme="dark"] { color-scheme:dark; --bg:#0F1F17; --surface:#1E3A2E; --text:#C7CBB8; --muted:#9DAD98; }
    body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
    main { max-width:640px; margin:0 auto; padding-block:24px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
    a { color:var(--text); }
    .card { background:var(--surface); border-radius:22px; padding:20px; margin:12px 0; }
    button { background:var(--fill); color:var(--on-fill); border:0; border-radius:999px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
    code { color:var(--muted); word-break:break-all; }
  </style>
</head>
<body></body>
</html>
