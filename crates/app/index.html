<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Gold School</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="gold-app" />
  <link data-trunk rel="inline" href="style/out.css" />
  <script>
    // First-paint theme hint. The viewer may already set data-theme from its own setting; remember it
    // so "System" can hand control back. A saved manual choice wins.
    (function () {
      var root = document.documentElement;
      window.__gsHostTheme = root.getAttribute("data-theme");
      try {
        var t = localStorage.getItem("gs-theme");
        if (t === "dark" || t === "light") root.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body></body>
</html>
