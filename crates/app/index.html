<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Telosgard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="telosgard-app" />
  <link data-trunk rel="inline" href="style/out.css" />
  <script>
    // First-paint theme hint. The viewer may already set data-theme from its own setting; remember it
    // so "System" can hand control back. A saved manual choice wins.
    (function () {
      var root = document.documentElement;
      window.__gsHostTheme = root.getAttribute("data-theme");
      try {
        var t = localStorage.getItem("gs-theme");
        if (t === "dark" || t === "light") root.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="gs-boot" role="status" aria-live="polite" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--color-bg);color:var(--color-text-muted);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;z-index:60">
    <div style="display:grid;justify-items:center;gap:12px">
      <span class="gs-boot-dot" aria-hidden="true" style="width:12px;height:12px;border-radius:999px;background:var(--color-text-muted)"></span>
      <span>Loading Telosgard…</span>
    </div>
  </div>
  <style>
    @keyframes gs-pulse { 0%,100% { opacity:.35; transform:scale(.8) } 50% { opacity:1; transform:scale(1) } }
    .gs-boot-dot { animation: gs-pulse 1.2s ease-in-out infinite }
    @media (prefers-reduced-motion: reduce) { .gs-boot-dot { animation: none } }
  </style>
  <script>
    addEventListener("TrunkApplicationStarted", function () {
      var b = document.getElementById("gs-boot");
      if (b) b.remove();
    });
  </script>
</body>
</html>
