[package]
name = "gold-app"
description = "Gold School front-end (Leptos CSR, compiled to wasm32)."
edition.workspace = true
version.workspace = true

[dependencies]
gold-core = { path = "../core" }
gold-content = { path = "../content" }
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Storage", "Element", "HtmlElement", "KeyboardEvent"] }
console_error_panic_hook = "=0.1.7"
serde = { workspace = true }
serde_json = "=1.0.154"
wasm-bindgen-futures = "=0.4.80"
