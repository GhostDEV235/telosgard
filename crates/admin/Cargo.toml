[package]
name = "telosgard-admin"
description = "Telosgard's admin dashboard (ADR 0006): Leptos CSR, its own WASM bundle served at /admin."
edition.workspace = true
version.workspace = true

[dependencies]
telosgard-ui = { path = "../ui" }
telosgard-content = { path = "../content" }
leptos = { version = "=0.8.23", features = ["csr"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["KeyboardEvent", "HtmlInputElement", "Element"] }
console_error_panic_hook = "=0.1.7"
serde = { workspace = true }
serde_json = "=1.0.154"
qrcodegen = "=1.8.0"
