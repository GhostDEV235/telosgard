[workspace]
resolver = "3"
members = ["crates/core", "crates/content", "crates/ui", "crates/app", "crates/admin"]
exclude = ["spike"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
